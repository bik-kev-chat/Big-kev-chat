<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIG-KEV CHAT</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>BIG-KEV CHAT</h1>
    <p>Messagerie</p>
  </header>

  <main id="chat">
    <div class="message received">
      Salut 👋 Bienvenue sur BIG-KEV CHAT !
    </div>
  </main>

  <footer>
    <input
      type="text"
      id="messageInput"
      placeholder="Écrire un message..."
    >

    <button onclick="sendMessage()">➤</button>
  </footer>

  <script src="script.js"></script>

</body>
</html>
